# Banco local de desenvolvimento e testes. Não usar em produção.
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ortelius
      POSTGRES_PASSWORD: ortelius
      POSTGRES_DB: ortelius
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Desliga o init da imagem, que instala postgis_topology e tiger_geocoder; as extensões
      # pertencem às migrations, como em produção.
      - /dev/null:/docker-entrypoint-initdb.d/10_postgis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ortelius -d ortelius"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
